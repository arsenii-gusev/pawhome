services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: pets
      POSTGRES_DB: pawhome
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pets -d pawhome']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://pets:pets@db:5432/pawhome
      JWT_SECRET: change-me-in-production
      ADMIN_EMAIL: admin@pawhome.local
      ADMIN_PASSWORD: admin12345
      SEED_DEMO: 'true'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
