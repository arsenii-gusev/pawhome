name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — сборка, unit и e2e тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pets
          POSTGRES_PASSWORD: pets
          POSTGRES_DB: pawhome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pets -d pawhome_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test -- --coverage
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgres://pets:pets@localhost:5432/pawhome_test
          JWT_SECRET: ci-secret

  web:
    name: Web — сборка Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx ng build

  docker:
    name: Docker Compose — сборка образов
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
